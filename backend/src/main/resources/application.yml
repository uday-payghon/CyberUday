spring:
  application:
    name: cyber-uday-kyc-verification-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/cyber_uday}
    username: ${POSTGRES_USER:cyber_uday}
    password: ${POSTGRES_PASSWORD:cyber_uday}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

server:
  port: ${PORT:8443}
  forward-headers-strategy: framework
  ssl:
    enabled: ${CYBER_UDAY_SSL_ENABLED:false}
    enabled-protocols: TLSv1.3
    key-store: ${CYBER_UDAY_TLS_KEYSTORE:}
    key-store-password: ${CYBER_UDAY_TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${CYBER_UDAY_TLS_KEYSTORE_TYPE:PKCS12}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cyber-uday:
  security:
    admin-secret: ${CYBER_UDAY_ADMIN_SECRET}
  crypto:
    # Base64-encoded 32-byte AES key. Generate with:
    # openssl rand -base64 32
    aes-256-key: ${CYBER_UDAY_AES_256_KEY}
  support-bot:
    api-key: ${DIGITAL_BODYGUARD_BOT_KEY}
    endpoint-url: ${DIGITAL_BODYGUARD_BOT_ENDPOINT:https://api.openai.com/v1/responses}
    model: ${DIGITAL_BODYGUARD_BOT_MODEL:gpt-4o-mini}
    timeout-seconds: ${DIGITAL_BODYGUARD_BOT_TIMEOUT_SECONDS:20}

logging:
  level:
    root: INFO
    com.cyberuday.verification: INFO
